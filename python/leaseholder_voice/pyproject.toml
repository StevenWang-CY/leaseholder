[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "leaseholder-voice"
version = "0.3.0"
description = "Leaseholder's realtime voice plane on LiveKit Agents 1.8.8: the voice agent, measurement callers and plugin factory"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[openai,silero]==1.8.8",
    "livekit==1.1.20",  # the rtc SDK livekit-agents 1.8.8 pins
    "livekit-api>=1.2",
    "openai>=3.19,<4",
    "httpx2>=2.12,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "aiohttp>=3.10",
    "psutil>=7.0",
]

[project.scripts]
lh-voice = "leaseholder_voice.cli:main"
lh-voice-worker = "leaseholder_voice.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs a LiveKit room in an isolated network namespace (Linux, livekit-server)",
]
