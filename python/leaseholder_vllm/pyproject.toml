[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "leaseholder-vllm"
version = "0.3.0"
description = "The tests of Leaseholder's engine variants for vLLM 0.32: their builds against vLLM's scheduler source, and make-room on the real scheduler"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# vLLM itself comes from the engine environment (deploy/phastform/requirements/engine.txt).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
