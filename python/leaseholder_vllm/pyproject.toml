[project]
name = "leaseholder-vllm"
version = "0.0.1"
description = "Leaseholder's engine-side plugins for vLLM 0.32: a lease-aware CPU-tier cache policy and an offloading connector with per-request hit receipts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# vLLM itself comes from the engine environment (deploy/phastform/requirements/engine.txt).
dependencies = []

[project.optional-dependencies]
# The vLLM dependencies the offload manager imports when it is loaded from source.
test = ["pytest>=8", "msgspec", "numpy", "typing-extensions>=4.12"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
