# Plugin check variant of lh-engine. run.sh links this drop-in in for the check and removes it afterwards.
# Same frozen configuration, with Leaseholder's connector and a recording lease policy on the CPU tier.
[Service]
Environment=PYTHONPATH=%h/leaseholder/src/python/leaseholder_vllm/src:%h/leaseholder/src/python/leaseholder_vllm/tests/live
Environment=LH_PROBE_LOG=%h/leaseholder/runs/engine-check/probe.jsonl
ExecStart=
ExecStart=%h/leaseholder/venvs/engine/bin/vllm serve --config %h/leaseholder/src/deploy/phastform/engine.yaml --kv-transfer-config '{"kv_connector":"LeaseConnector","kv_connector_module_path":"leaseholder_vllm.connector","kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":21474836480,"offload_prompt_only":false,"eviction_policy":"ProbeLeasePolicy","cache_policy_module_path":"probe_policy"}}'
