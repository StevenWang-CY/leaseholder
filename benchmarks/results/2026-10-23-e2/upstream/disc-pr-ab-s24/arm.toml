# E2 discriminating scenario, the engine as the two vLLM PRs propose it: make-room's KV preemption and its budget cap
# (16 tokens), no reserve, behind the gateway without an admission policy.
arm = 9
label = "vLLM PRs A and B: KV preemption and the budget cap, no gateway policy"

[agents]
sessions = 24
data = "weka-x32-long"

[engine]
variant = "make-room"
flags = ["--additional-config.make_room.reserve_tokens", "0"]
