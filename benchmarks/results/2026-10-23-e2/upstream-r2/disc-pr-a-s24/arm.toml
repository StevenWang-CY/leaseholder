# E2 discriminating scenario (24 session trees on weka-x32-long, as disc-frozen-s24.toml), the engine as the first vLLM
# PR proposes it: make-room's KV preemption alone (the budget cap off, no reserve), behind the gateway without an
# admission policy.
arm = 9
label = "vLLM PR A: make-room's KV preemption alone, no gateway policy"

[agents]
sessions = 24
data = "weka-x32-long"

[engine]
variant = "make-room"
flags = ["--additional-config.make_room.budget_cap", "false", "--additional-config.make_room.reserve_tokens", "0"]
