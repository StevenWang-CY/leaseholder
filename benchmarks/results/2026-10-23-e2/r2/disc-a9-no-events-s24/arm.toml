# E2 arm 9, Leaseholder, in the discriminating scenario (24 session trees on weka-x32-long, as disc-frozen-s24.toml).
# Arm 9 with the voice worker's lifecycle events off: the gateway knows a turn only from its realtime request.
arm = 9
label = "Leaseholder without lifecycle events"

[agents]
sessions = 24
data = "weka-x32-long"

[voice]
events = false

[gateway.admission]
policy = "leaseholder"
headroom_tokens = 1024
critical_prefill_budget_ms = 150
degrade_max_tokens = 16

[engine]
variant = "make-room"
