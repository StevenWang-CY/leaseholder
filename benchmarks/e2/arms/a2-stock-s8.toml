# E2 arm 2: vLLM out of the box (FCFS, default chunking, nothing signals priority) beside 8 agent session trees.
arm = 2
label = "stock vLLM: FCFS, default chunking"

[agents]
sessions = 8

[gateway]
upstream_priority = []

[engine]
flags = ["--scheduling-policy", "fcfs", "--max-num-batched-tokens", "2048", "--long-prefill-token-threshold", "0"]
