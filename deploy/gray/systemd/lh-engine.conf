# Gray: the GPU is local to NUMA node 0 (cores 0-7), where Phastform's is on node 1. Gray has no CUDA 13 toolkit, so
# the engine JIT-compiles with the CUDA 13 compiler its venv carries (nvidia-cuda-nvcc, pinned by the engine lock).
[Service]
Environment=CUDA_HOME=%h/leaseholder/venvs/engine/lib/python3.12/site-packages/nvidia/cu13
Environment=PATH=%h/leaseholder/venvs/engine/bin:%h/leaseholder/venvs/engine/lib/python3.12/site-packages/nvidia/cu13/bin:/usr/local/bin:/usr/bin:/bin:%h/.local/bin
CPUAffinity=
CPUAffinity=0-7
NUMAMask=
NUMAMask=0
