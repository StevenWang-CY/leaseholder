# Gray: the audio servers take NUMA node 1 (cores 8-15), away from the GPU-local node 0, which is the engine's. With no
# CUDA 13 toolkit on the host, the STT server uses the engine venv's CUDA 13 compiler, as the engine does.
[Service]
Environment=CUDA_HOME=%h/leaseholder/venvs/engine/lib/python3.12/site-packages/nvidia/cu13
Environment=PATH=%h/leaseholder/venvs/engine/bin:%h/leaseholder/venvs/engine/lib/python3.12/site-packages/nvidia/cu13/bin:/usr/local/bin:/usr/bin:/bin
CPUAffinity=
CPUAffinity=8-15
NUMAMask=
NUMAMask=1
