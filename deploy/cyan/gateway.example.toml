# lh-gateway on cyan. Copy to ~/.config/leaseholder/gateway.toml (mode 600) and replace each placeholder with
# the SHA-256 of a new key; the file holds digests only. To make a key and its digest:
#   key=$(head -c 32 /dev/urandom | base64 | tr -d '/+=\n'); printf '%s' "$key" | sha256sum
# Every key is described in crates/lh-gateway/README.md.

# vLLM on Phastform, through lh-tunnel-phastform.
upstream = "http://127.0.0.1:18000"
# The engine keeps idle connections for 60 s (VLLM_HTTP_TIMEOUT_KEEP_ALIVE in lh-engine.service), so voice turns
# seconds apart reuse a warm connection; let go of one 5 s before the engine would.
upstream_idle_timeout_s = 55
log_format = "json"
# How the class's priority reaches the upstream: X-Vllm-Priority (the default, for vLLM's priority scheduling),
# the body's `priority` (SGLang) or X-SMG-Priority (SMG). vLLM's FCFS scheduling needs the empty list.
# upstream_priority = ["vllm-header"]

# The host network. Other users of cyan can reach loopback, so requests here need a key.
[[listen]]
tcp = "127.0.0.1:18080"

# The voice plane's way in. The socket file is private to this user, so its requests need no key. The path is
# the units' %t/lh/gateway.sock, with cyan's deploy user's uid (1007; `id -u` elsewhere).
[[listen]]
unix = "/run/user/1007/lh/gateway.sock"
tenant = "voice"

# The LiveKit voice worker. It sends X-Session-ID (voice-<room SID>) and X-LH-Class: realtime.
[tenants.voice]
trusted = true
default_class = "realtime"
max_class = "realtime"

# agentic-api, carrying Claude Code and Codex sessions.
[tenants.agents]
keys_sha256 = ["<sha256 of the agents key>"]
trusted = true
default_class = "background"
max_class = "interactive"

# Load generators (AIPerf replays). Untrusted: their X-Session-ID and X-LH-Class are ignored.
[tenants.bench]
keys_sha256 = ["<sha256 of the bench key>"]
default_class = "interactive"

# The admission policy (crates/lh-gateway/README.md#admission). Without the table, every request goes upstream
# at once. E2's baselines set one policy and its keys:
# [admission]
# policy = "static-cap"
# background_max_in_flight = 4
#
# policy = "token-reservation"
# reserved_tokens = 2048
# pool_tokens = 36400
#
# policy = "flow-control"
# ceilings = { realtime = 16, interactive = 12, background = 8 }
#
# policy = "preempt-resubmit"
#
# Leaseholder's own policy (E2 arm 9). headroom_tokens is one voice turn at its longest, for each armed session:
# arm 1 averaged 646 prompt and 23 completion tokens a turn.
# policy = "leaseholder"
# headroom_tokens = 1024
# critical_prefill_budget_ms = 150
# degrade_max_tokens = 16
# and, with their defaults:
# trigger = "onset"
# max_num_batched_tokens = 512
# max_defer_s = 10
# state_timeout_s = 10
# An ablation switches one mechanism off and drops its keys: headroom = false (and trigger), throttle = false
# (and critical_prefill_budget_ms, max_num_batched_tokens), degrade = false (and degrade_max_tokens).
#
# Every policy's queues (leaseholder refuses no request for its wait, and takes no queue_timeout_s):
# queue_limit = 1024
# queue_timeout_s = 60
