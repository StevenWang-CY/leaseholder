# Variant no-preemptive-generation: the agent starts its reply only once the end of the turn is confirmed, instead of
# from the final transcript before it (LiveKit's preemptive generation, on by default). One of E2's factors;
# lh-bench e2 run links it for an arm with preemptive_generation = false. See worker.py.
[Service]
Environment=LH_PREEMPTIVE_GENERATION=false
