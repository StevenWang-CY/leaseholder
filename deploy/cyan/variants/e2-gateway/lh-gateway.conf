# Variant e2-gateway: the gateway runs from the configuration lh-bench e2 run writes for a point,
# ~/.config/leaseholder/gateway-e2.toml: gateway.toml with the arm file's [gateway] table merged in. lh-bench e2 run
# links this drop-in for an arm with a [gateway] table and removes it for one without; lh-bench e2 reset removes it.
[Service]
ExecStart=
ExecStart=%h/leaseholder/bin/lh-gateway --config %h/.config/leaseholder/gateway-e2.toml
