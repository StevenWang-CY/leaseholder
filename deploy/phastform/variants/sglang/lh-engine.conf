# Variant sglang (E2 arm 7b): SGLang 0.5.22 instead of vLLM on the engine's port, with the same model, step cap and
# KV pool, and priority scheduling with preemption. Build its environment once with install.sh.
#   --enable-priority-scheduling --schedule-low-priority-values-first: lower values run first, as vLLM's priorities;
#     the gateway sends them in the body (upstream_priority = ["body"]).
#   --priority-scheduling-preemption-threshold 0: a waiting request preempts running ones of any lower priority.
#     SGLang's default, 10, preempts only for a gap of more than 10, so with the priorities 0, 1 and 2 it never does.
#   --chunked-prefill-size 512: the frozen box's step cap.
#   --mem-fraction-static 0.77 --max-total-tokens 36400: the frozen box's KV pool (BF16, 144 KiB a token; 0.58 gave
#     19,443 tokens, 0.74 gave 33,583). SGLang logs it as "KV Cache is allocated ... #tokens".
#   --enable-metrics: the /metrics that lh-bench e2 run snapshots.
[Service]
Environment=PATH=%h/leaseholder/venvs/sglang/bin:/usr/local/cuda-13.0/bin:/usr/local/bin:/usr/bin:/bin
# SGLang's FlashInfer is not vLLM's build: a JIT workspace of its own.
Environment=FLASHINFER_WORKSPACE_BASE=%h/leaseholder/cache/flashinfer-sglang
# Keep idle connections for 60 s, as the vLLM engine does (SGLang's default is 5 s): the gateway reuses its pooled
# connections for up to 55 s.
Environment=SGLANG_TIMEOUT_KEEP_ALIVE=60
ExecStart=
ExecStart=%h/leaseholder/venvs/sglang/bin/python -m sglang.launch_server --model-path Qwen/Qwen3-4B-Instruct-2507-FP8 --host 127.0.0.1 --port 8000 --context-length 32768 --mem-fraction-static 0.77 --max-total-tokens 36400 --chunked-prefill-size 512 --enable-priority-scheduling --schedule-low-priority-values-first --priority-scheduling-preemption-threshold 0 --enable-metrics $LH_ENGINE_FLAGS
# Started means serving at speed. The first sampled request after a start compiles FlashInfer's sampling kernels
# (about 2.5 minutes on this CPU the first time) and stalls every request meanwhile, so the unit sends one after
# /health answers, before it counts as up.
ExecStartPost=/usr/bin/curl -fsS -m 900 -o /dev/null -H "Content-Type: application/json" -d '{"model": "Qwen/Qwen3-4B-Instruct-2507-FP8", "messages": [{"role": "user", "content": "Say hi."}], "max_tokens": 8, "temperature": 0.7}' http://127.0.0.1:8000/v1/chat/completions
TimeoutStartSec=2400
