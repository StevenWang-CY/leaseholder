# Variant make-room (E2 arm 9, engine side): Leaseholder's scheduler change for vLLM #40004 on the frozen box. Under
# priority scheduling, the waiting request of the highest priority takes KV and step budget from running requests of
# a lower priority. build.py generates the scheduler module from the installed vLLM at every start (into
# cache/make-room) and the engine loads it with --scheduler-cls. --max-num-seqs stays the frozen box's.
#
# Three switches, keys of --additional-config's make_room table, read once at engine start:
#   max_preemptions_per_step  KV make-room: a waiting request short of free KV blocks for its whole remaining
#                             sequence preempts running requests of a strictly lower priority, the largest first, at
#                             most this many a step and none if that many would not make it fit. 0 is off
#   budget_cap                a running prefill of a lower priority leaves the waiting request's first chunk in the
#                             step's token budget; decodes are never cut
#   reserve_tokens            requests of a positive priority value (interactive 1, background 2) are admitted only if
#                             this many tokens of KV stay free beside their whole sequence, for priority 0 (realtime).
#                             0 is off
# Arm 9 runs them as set below: two preemptions a step, and a reserve of two voice turns at their longest, as arm 6's
# token reservation. An ablation sets one in its arm file's [engine] flags, which come last and win, e.g.
# ["--additional-config.make_room.reserve_tokens", "0"]. probe.py is the KV check.
[Service]
ExecStartPre=%h/leaseholder/venvs/engine/bin/python %h/leaseholder/src/deploy/phastform/variants/make-room/build.py %h/leaseholder/cache/make-room
Environment=PYTHONPATH=%h/leaseholder/cache/make-room
ExecStart=
ExecStart=%h/leaseholder/venvs/engine/bin/vllm serve --config %h/leaseholder/src/deploy/phastform/engine.yaml --scheduler-cls lh_make_room_scheduler.AsyncScheduler --additional-config.make_room.max_preemptions_per_step 2 --additional-config.make_room.budget_cap true --additional-config.make_room.reserve_tokens 2048 $LH_ENGINE_FLAGS
