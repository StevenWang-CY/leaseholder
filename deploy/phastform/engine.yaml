# Frozen-box LLM engine on Phastform: vLLM 0.32.0 on one RTX 5060 Ti 16 GB, beside the STT and TTS servers.
# lh-engine.service runs `vllm serve --config <this file>`. Every experiment shares these values; a sweep
# overrides single flags on the command line (vLLM gives the command line precedence over this file).
model: Qwen/Qwen3-4B-Instruct-2507-FP8
# The measured weights. The units run offline, and a download by commit writes no refs/main, so the pin is what a
# fresh host resolves; bootstrap.sh downloads the revision named here.
revision: 8591804019c8b22094c3b5b4454e0edc05dffc98
host: 127.0.0.1
port: 8000
max-model-len: 32768
disable-uvicorn-access-log: true
# Agents call tools: parse Qwen3's tool calls into OpenAI tool_calls (chat completions and Responses). Requests without
# tools are unaffected.
enable-auto-tool-choice: true
tool-call-parser: hermes

# The KV pool is fixed at 5 GiB (36,400 tokens), so the footprint depends neither on the profiler nor on the
# audio servers. vLLM still requires utilization x total memory to be free at start: 10.83 GiB, with about
# 12 GiB free once STT and TTS are resident.
kv-cache-memory: 5368709120
gpu-memory-utilization: 0.70
enable-prefix-caching: true

# Priority orders the waiting queue and picks the running request to preempt when the KV cache is full; it never
# preempts running work to admit a waiting request (vLLM #40004). The step cap bounds how long running decodes wait
# behind a prefill.
scheduling-policy: priority
max-num-batched-tokens: 512
long-prefill-token-threshold: 256

# Observability: per-request cached tokens and sampled KV residency histograms. No KV cache events: they carry
# every cached block's token ids and session id, vLLM's publisher sends them to whoever binds its TCP endpoint
# and replays them to anyone who asks, and nothing here reads them.
enable-prompt-tokens-details: true
kv-cache-metrics: true
kv-cache-metrics-sample: 0.05

# Host tier: vLLM's native CPU offload, write-through (generated tokens are stored as well), sized at 20 GiB,
# four times the GPU pool. E1 sweeps 2x, 4x and 8x.
kv-transfer-config:
  kv_connector: OffloadingConnector
  kv_role: kv_both
  kv_connector_extra_config:
    cpu_bytes_to_use: 21474836480
    offload_prompt_only: false
